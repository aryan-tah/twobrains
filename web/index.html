/* ---------- streams: particles flowing along curves ---------- */

}
const sensM = new Stream(260, "#9ad0ff", 2.2), motM = new Stream(200, "#4aa3ff", 2.2), sensF = new Stream(260, "#ffb3d1", 2.2), motF = new Stream(200, "#ff5fa2", 2.2), song = new Stream(420, "#ffd166", 2.6), cva = new Stream(160, "#c8ff5c", 1.8);

/* ---------- traces / hud ---------- */
function drawTraces() {
  const c = $("tr"), W = c.clientWidth, H = c.clientHeight; if (c.width !== W * PR) { c.width = W * PR; c.height = H * PR; } const g = c.getContext("2d"); g.setTransform(PR, 0, 0, PR, 0, 0); g.clearRect(0, 0, W, H);
  const rows = [["male", "P1", "#ffd166", "♂ P1"], ["male", "song", "#ff8c42", "♂ song DN (pIP10)"], ["female", "P1", "#ff5fa2", "♀ pC1"], ["female", "accept", "#2ee6a6", "♀ accept DN (vpoDN)"], ["female", "reject", "#ff4d4d", "♀ reject DN (DNp13)"]];
  const n = data.ticks, x0 = 150, w = W - x0 - 12, rh = (H - 8) / rows.length;
  rows.forEach(([who, key, col, label], r) => { const s = data.series[who][key] || []; const mx = Math.max(5, ...s); const y0 = 4 + r * rh;
    g.fillStyle = "#8a90a8"; g.font = "11px IBM Plex Sans, system-ui"; g.fillText(label, 12, y0 + rh * 0.68);
    g.strokeStyle = col; g.lineWidth = 1.1; g.globalAlpha = 0.85; g.beginPath(); for (let t = 0; t < n; t++) { const X = x0 + t / n * w, Y = y0 + rh - 2 - (s[t] / mx) * (rh - 5); t ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke(); g.globalAlpha = 1; });
  g.strokeStyle = "#eef0f7"; g.beginPath(); const X = x0 + tick / n * w; g.moveTo(X, 3); g.lineTo(X, H - 3); g.stroke();
}
function hud() {
  const f = (who, k) => (data.series[who][k] ? data.series[who][k][tick] : 0).toFixed(0);
  $("mHud").innerHTML = `active neurons <b>${f("male", "_active")}</b><br>P1 <b>${f("male", "P1")} Hz</b> · song DN <b>${f("male", "song")} Hz</b><br>turn L/R <b>${f("male", "turn_L")}/${f("male", "turn_R")}</b> · forward <b>${f("male", "forward")}</b>`;
  $("fHud").innerHTML = `active neurons <b>${f("female", "_active")}</b><br>pC1 <b>${f("female", "P1")} Hz</b> · accept DN <b>${f("female", "accept")} Hz</b> · reject DN <b>${f("female", "reject")} Hz</b><br>turn L/R <b>${f("female", "turn_L")}/${f("female", "turn_R")}</b> · forward <b>${f("female", "forward")}</b>`;
  const [,,,,,, sing, accpt, rej, d] = data.bodies[tick];
  $("aHud").innerHTML = `distance <b>${d.toFixed(1)} mm</b> · ♂ song <b>${(sing * 100).toFixed(0)}%</b> · ♀ accept <b>${(accpt * 100).toFixed(0)}%</b> · reject <b>${(rej * 100).toFixed(0)}%</b>`;
  $("scrub").value = tick; $("time").textContent = (tick * data.tick_ms / 1000).toFixed(2) + " s";
}
function setTrail(line, ix, iy) { const a = line.geometry.attributes.position.array, t0 = Math.max(0, tick - 239); let k = 0; for (let t = t0; t <= tick; t++) { const b = data.bodies[t]; a[k++] = b[ix]; a[k++] = 0.2; a[k++] = -b[iy]; } line.geometry.setDrawRange(0, tick - t0 + 1); line.geometry.attributes.position.needsUpdate = true; }
function pose(fly, x, y, h, t, singing) {
  fly.g.position.set(x, 0.62 + Math.sin(t * 6) * 0.02, -y); fly.g.rotation.y = h * Math.PI / 180;
  for (const w of fly.wings) { const ext = singing > 0.02 && w.s === 1 ? 1.3 * Math.min(1, singing * 2) : 0; w.piv.rotation.y = w.s * 0.3 + ext * w.s + (ext ? Math.sin(t * 95) * 0.4 : 0); }
}
const sum = (who, keys) => keys.reduce((s, k) => s + (data.series[who][k] ? data.series[who][k][tick] : 0), 0);

async function load(name) {
  $("status").textContent = "loading " + (LABELS[name] || name) + "…";
  data = window.TWOBRAINS_DATA ? window.TWOBRAINS_DATA[name] : await (await fetch(`data/${name}.json`)).json();
  tick = 0; $("scrub").max = data.ticks - 1; mBrain.load(data.brains.male); fBrain.load(data.brains.female);
  for (const who of ["male", "female"]) { const b = data.brains[who];
    $(who[0] + "Info").textContent = `${b.n_total.toLocaleString()} neurons · ${b.edges.length.toLocaleString()} wires shown`;
    $(who[0] + "Legend").innerHTML = b.groups.map((g, i) => i ? `<span style="color:${GROUP_COLORS[i]}"><i style="background:${GROUP_COLORS[i]}"></i><span style="color:#8a90a8">${g}</span></span>` : "").join(""); }
  $("status").textContent = `${(data.ticks * data.tick_ms / 1000).toFixed(0)} s simulated · ${data.brains.male.n_total.toLocaleString()} + ${data.brains.female.n_total.toLocaleString()} neurons`;

}
function loop(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000); lastT = ts; const t = ts / 1000;

    let advanced = false;
    if (playing) { acc += dt * speed * 1000 / data.tick_ms; while (acc >= 1) { acc -= 1; tick = (tick + 1) % data.ticks; advanced = true; mBrain.step(data.brains.male.spikes[tick], true); fBrain.step(data.brains.female.spikes[tick], true); } }
    if (!advanced) { mBrain.step([], false); fBrain.step([], false); } else { drawTraces(); hud(); }
    mBrain.update(dt); fBrain.update(dt);
    const [mx, my, mh, fx, fy, fh, sing, accpt, rej, d] = data.bodies[tick];
    pose(male, mx, my, mh, t, sing); pose(female, fx, fy, fh, t, 0);
    male.halo.intensity = 1 + sing * 2; female.mats[0].emissiveIntensity = 0.3 + accpt * 1.4;
    acceptLight.position.set(fx, 1.6, -fy); acceptLight.intensity = accpt * 5; rejectLight.position.set(fx, 1.6, -fy); rejectLight.intensity = rej * 5;
    rings.forEach((m, i) => { const ph = ((t * 0.8) + i / 5) % 1; m.position.set(mx, 0.08, -my); m.scale.setScalar(0.7 + ph * 9); m.material.opacity = sing > 0.02 ? (1 - ph) * 0.6 * Math.min(1, sing * 1.5) : 0; });
    setTrail(trailM, 0, 1); setTrail(trailF, 3, 4);
    // streams: sensory input up to each brain, motor commands down, song across
    const mPos = new THREE.Vector3(mx, 1.2, -my), fPos = new THREE.Vector3(fx, 1.2, -fy);
    const mIn = Math.min(1, sum("male", ["vision_L", "vision_R", "smell", "touch_L", "touch_R"]) / 250), fIn = Math.min(1, sum("female", ["vision_L", "vision_R", "smell", "song"]) / 250);
    const mOut = Math.min(1, sum("male", ["turn_L", "turn_R", "forward", "song"]) / 40), fOut = Math.min(1, sum("female", ["turn_L", "turn_R", "forward", "accept", "reject"]) / 40);
    sensM.update(dt, mPos, mBrain.bottom().add(new THREE.Vector3(-2, 0, 0)), 0.15 + mIn, 1.2); motM.update(dt, mBrain.bottom().add(new THREE.Vector3(2, 0, 0)), mPos, mOut, 1.0);
    sensF.update(dt, fPos, fBrain.bottom().add(new THREE.Vector3(2, 0, 0)), 0.15 + fIn, 1.2); motF.update(dt, fBrain.bottom().add(new THREE.Vector3(-2, 0, 0)), fPos, fOut, 1.0);
    song.update(dt, mPos.clone().add(new THREE.Vector3(0, 0.6, 0)), fBrain.world(fBrain.jo), sing * Math.max(0, 1 - d / 8), 2.2);
    cva.update(dt, mPos, fBrain.bottom(), Math.max(0, 1 - d / 5) * 0.5, 1.5);
  }
  if (auto) theta += dt * 0.06;
  cam.position.set(target.x + Math.sin(theta) * Math.sin(phi) * dist, target.y + Math.cos(phi) * dist, target.z + Math.cos(theta) * Math.sin(phi) * dist); cam.lookAt(target);
  renderer.render(scene, cam); requestAnimationFrame(loop);
}
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ pause" : "▶ play"; };
$("speed").onchange = e => speed = +e.target.value;
$("wires").onchange = e => { mBrain.wires.visible = fBrain.wires.visible = e.target.checked; };
$("scrub").oninput = e => { tick = +e.target.value; mBrain.glow.fill(0); fBrain.glow.fill(0); mBrain.step(data.brains.male.spikes[tick], true); fBrain.step(data.brains.female.spikes[tick], true); drawTraces(); hud(); };
$("run").innerHTML = RUNS.map(r => `<option value="${r}">${LABELS[r] || r}</option>`).join(""); $("run").onchange = e => load(e.target.value);
load(RUNS[0]); requestAnimationFrame(loop);
</script>
